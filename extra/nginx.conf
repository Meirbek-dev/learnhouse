# Cache configuration for Next.js static assets
proxy_cache_path /var/cache/nginx/next levels=1:2 keys_zone=next_static:100m max_size=2g inactive=30d use_temp_path=off;

# Map to bypass cache for specific cache-control headers
map $http_cache_control $static_cache_bypass {
  default 0;
  ~*no-cache 1;
  ~*max-age=0 1;
}

# Rate limiting zones - exclude static assets from rate limiting
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
geo $limit_static {
  default 1;
  # Don't rate limit internal requests
  127.0.0.1 0;
  192.168.0.0/16 0;
}
map $limit_static $limit_static_key {
  0 "";
  1 $binary_remote_addr;
}
limit_req_zone $limit_static_key zone=static_assets:10m rate=100r/s;

server {
  server_name cs-mooc.tou.edu.kz;
  client_max_body_size 500M;

  # Increase header buffer size
  large_client_header_buffers 4 32k;

  # Increase the maximum allowed size of the client request body
  client_body_buffer_size 32k;

  # Increase the maximum allowed size of the client request header fields
  client_header_buffer_size 32k;

  # Proxy buffers for better performance
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;

  # Next.js static files (_next/static) with aggressive caching - NO RATE LIMITING
  location /_next/static {
    # Allow high burst for chunk loading
    limit_req zone=static_assets burst=100 nodelay;

    proxy_pass http://localhost:8000;
    proxy_cache next_static;
    proxy_cache_key "$scheme://$host$request_uri";
    proxy_cache_valid 200 365d;
    proxy_cache_use_stale error timeout invalid_header http_500 http_502 http_503 http_504 http_429 updating;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_bypass $static_cache_bypass;
    proxy_no_cache $static_cache_bypass;
    proxy_ignore_headers Set-Cookie;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Next-Cache $upstream_cache_status;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next.js media files
  location /_next/image {
    # Allow high burst for image loading
    limit_req zone=static_assets burst=50 nodelay;

    proxy_pass http://localhost:8000;
    proxy_cache next_static;
    proxy_cache_key "$scheme://$host$request_uri";
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout invalid_header http_500 http_502 http_503 http_504 http_429 updating;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_bypass $static_cache_bypass;
    proxy_no_cache $static_cache_bypass;
    proxy_ignore_headers Set-Cookie;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Next-Cache $upstream_cache_status;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # NextJS Revalidation
  location /api/revalidate {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://localhost:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Next Auth
  location /api/auth {
    limit_req zone=general burst=10 nodelay;
    proxy_pass http://localhost:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Python Backend API
  location /api/v1 {
    limit_req zone=general burst=30 nodelay;
    proxy_pass http://localhost:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Backend Static Content - NO RATE LIMITING for media files
  location /content {
    limit_req zone=static_assets burst=100 nodelay;
    proxy_pass http://localhost:9000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend
  location / {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://localhost:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
