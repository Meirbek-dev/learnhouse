# nginx SSL server block template for cs-mooc.tou.edu.kz
# Replace /etc/letsencrypt/... paths with your cert files.

server {
    listen 443 ssl http2;
    server_name cs-mooc.tou.edu.kz;

    # TLS certificate paths (Let's Encrypt example)
    ssl_certificate /etc/letsencrypt/live/cs-mooc.tou.edu.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cs-mooc.tou.edu.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;   # managed by certbot

    client_max_body_size 500M;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next.js static files
    location /_next/static {
        proxy_pass http://localhost:8000;
        proxy_cache_valid 200 365d;
        proxy_cache_bypass $http_cache_control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js image optimizer
    location /_next/image {
        proxy_pass http://localhost:8000;
    }

    # NextJS revalidation and auth
    location /api/revalidate { proxy_pass http://localhost:8000; }
    location /api/auth { proxy_pass http://localhost:8000; }

    # Python Backend API
    location /api/v1 {
        proxy_pass http://localhost:9000;
    }

    # Backend static content
    location /content { proxy_pass http://localhost:9000; }

    # Frontend catch-all
    location / { proxy_pass http://localhost:8000; }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name cs-mooc.tou.edu.kz;
    return 301 https://$host$request_uri;
}

# Notes:
# - Place this file on the host at /etc/nginx/conf.d/cs-mooc-ssl.conf or copy into container's /etc/nginx/conf.d/.
# - Use Certbot to obtain certs and ensure the certificate files paths above exist.
# - After installing certs, run `nginx -t` and reload nginx.
