services:
  app:
    build: .
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - .:/usr/openu
    env_file:
      - ./extra/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:18-trixie
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=openu
      - POSTGRES_PASSWORD=openu
      - POSTGRES_DB=openu
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openu']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8.2.1-bookworm
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
  chromadb:
    image: chromadb/chroma:1.1.0
    restart: unless-stopped
    ports:
      - '8001:8000'
