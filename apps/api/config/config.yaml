site_name: OpenU
site_description: OpenU is a platform tailored for learning experiences.
contact_email: hi@openu.app

# This config is optimized for local development. You can change the values according to your needs.

general:
  development_mode: true
  install_mode: true
  logfire_enabled: false
  timezone: "Asia/Almaty"  # Kazakhstan (Astana) timezone

security:
  auth_jwt_secret_key: secret

hosting_config:
  domain: openu.kz
  ssl: true
  port: 1338
  allowed_origins:
    - http://localhost:3000
    - http://localhost:3001
  cookies_config:
    domain: '.localhost'
  allowed_regexp: '\b((?:https?://)[^\s/$.?#].[^\s]*)\b'
  content_delivery:
    type: 'filesystem' # "filesystem" or "s3api"
    s3api:
      bucket_name: ''
      endpoint_url: ''

mailing_config:
  resend_api_key: ''
  system_email_adress: ''

database_config:
  sql_connection_string: postgresql+psycopg://openu:openu@localhost:5432/openu

redis_config:
  redis_connection_string: redis://localhost:6379/openu

payments_config:
  stripe:
    stripe_secret_key: ''
    stripe_publishable_key: ''
    stripe_webhook_standard_secret: ''
    stripe_client_id: ''

ai_config:
  chromadb_config:
    isSeparateDatabaseEnabled: True
    db_host: 'localhost'
