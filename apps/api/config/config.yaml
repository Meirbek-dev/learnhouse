# Deprecated reference file.
# Runtime settings are loaded from environment variables only.
# Keep this file as human-readable documentation for old local defaults, not as an active source.

contact_email: contact@cs-mooc.tou.edu.kz

general:
  development_mode: true
  logfire_enabled: false
  timezone: UTC

security:
  auth_jwt_secret_key: secret

hosting_config:
  domain: cs-mooc.tou.edu.kz
  ssl: true
  port: 1338
  use_default_org: true
  allowed_origins:
    - http://localhost:3000
    - http://localhost:3001
  cookie_config:
    domain: '.localhost'
  allowed_regexp: '\b((?:https?://)[^\s/$.?#].[^\s]*)\b'
  self_hosted: true

rbac:
  audit_logging_enabled: true
  cache_enabled: true
  cache_ttl_seconds: 300

mailing_config:
  resend_api_key: ""
  system_email_address: ""

database_config:
  sql_connection_string: postgresql+psycopg://openu:openu@localhost:5432/openu

redis_config:
  redis_connection_string: redis://localhost:6379/openu

payments_config:
  stripe:
    stripe_secret_key: ''
    stripe_publishable_key: ''
    stripe_webhook_standard_secret: ''
    stripe_webhook_connect_secret: ''
    stripe_client_id: ''

ai_config:
  openai_api_key: ""
  chromadb_config:
    separate_db_enabled: true
    db_host: "localhost"
    db_port: 8001
    persist_path: "./chromadb_data"
