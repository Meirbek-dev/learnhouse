[project]
description = "Learnhouse Backend"
name = "learnhouse-api"
version = "0.1.0"
requires-python = ">=3.13.2"
authors = [
    {name = "Badr B. (swve)"}
]
dependencies = [
    "boto3>=1.38.12",
    "botocore>=1.38.12",
    "faker>=37.1.0",
    "fastapi==0.115.9",
    "fastapi-jwt-auth>=0.5.0",
    "httpx>=0.28.1",
    "langchain>=0.2.5",
    "langchain-community>=0.2.5",
    "langchain-openai>=0.1.14",
    "openai>=1.78.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.10",
    "pydantic[email]>=1.10.21,<2.0.0",
    "pytest>=8.3.5",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "redis>=6.0.0",
    "requests>=2.32.3",
    "resend>=2.9.0",
    "sqlmodel>=0.0.24",
    "tiktoken>=0.9.0",
    "uvicorn>=0.34.2",
    "typer>=0.15.3",
    "chromadb>=1.0.8",
    "alembic>=1.15.2",
    "alembic-postgresql-enum>=1.7.0",
    "sqlalchemy-utils>=0.41.2",
    "stripe>=12.1.0",
    "python-jose>=3.4.0",
    "logfire[sqlalchemy]>=3.15.0",
]

[tool.ruff]
lint.ignore = ["E501", "E712"]

[tool.logfire]
ignore_no_config=true
