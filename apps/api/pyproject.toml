[project]
description = "Ashyq Bilim Backend"
name = "ashyq-bilim-api"
version = "0.1.0"
requires-python = ">=3.13.7,<3.14.0"
dependencies = [
  "boto3>=1.42.0",
  "botocore>=1.41.6",
  "fastapi[standard-no-fastapi-cloud-cli]>=0.123.0",
  "fastapi-another-jwt-auth>=0.1.11",
  "langchain>=1.1.0",
  "langchain-chroma>=1.0.0",
  "langchain-community>=0.4.1",
  "langchain-core>=1.1.0",
  "langchain-openai>=1.1.0",
  "langchain-text-splitters>=1.0.0",
  "openai>=2.8.1",
  "psycopg[binary,pool]>=3.2.13",
  "pydantic[email]>=2.12.5",
  "python-dotenv>=1.2.1",
  "pyyaml>=6.0.3",
  "redis[hiredis]>=7.1.0",
  "resend>=2.19.0",
  "sqlmodel>=0.0.27",
  "tiktoken>=0.12.0",
  "typer>=0.20.0",
  "chromadb>=1.3.5",
  "alembic>=1.17.2",
  "alembic-postgresql-enum>=1.8.0",
  "stripe>=14.0.1",
  "logfire[fastapi,sqlalchemy]>=4.15.1",
  "beautifulsoup4>=4.14.3",
  "python-ulid>=3.1.0",
  "argon2-cffi>=25.1.0",
  "orjson>=3.11.4",
  "httptools>=0.7.1",
  "brotli>=1.2.0",
  "cachetools>=6.2.2",
  "slowapi>=0.1.9",
]

[dependency-groups]

dev = [
  "faker>=38.2.0",
  "pyflakes>=3.4.0",
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0",
  "pytest-cov<6.0.0",
  "ruff>=0.14.7",
]

[tool.ruff]
target-version = "py314"
# lint.select = ["ALL"]
lint.fixable = ["ALL"]
lint.ignore = [
  "F401",
  "COM812",  # missing trailing comma (stylistic, optional)
  "DTZ005",  # datetime.now() used without tzinfo (not always relevant)
  "T20",     # flake8-print (allow print statements for debugging/logging)
  "TC002",   # type checking import block placement
  "TC001",   # type checking import not at top of file
  "TC003",   # type checking import formatting
  "PLR2004", # magic value used in comparison (often acceptable)
  "D",       # all docstring-related rules disabled
  "D100",    # missing docstring in public module
  "S101",    # Use of `assert` detected
  "TD002",   # Missing author in TODO;
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["asyncio: mark test as async"]

filterwarnings = [
  "ignore:.*Importing tools from langchain is deprecated.*",
]

format.quote-style = "double"

[tool.logfire]
ignore_no_config = true
