[project]
description = "OpenU Backend"
name = "openu-api"
version = "0.1.0"
requires-python = ">=3.13.2"
dependencies = [
  "boto3>=1.38.34",
  "botocore>=1.38.34",
  "faker>=37.3.0",
  "fastapi==0.115.9",
  "fastapi-another-jwt-auth>=0.1.11",
  "httpx>=0.28.1",
  "langchain>=0.3.25",
  "langchain-community>=0.3.25",
  "langchain-openai>=0.3.22",
  "openai>=1.86.0",
  "passlib>=1.7.4",
  "psycopg2-binary>=2.9.10",
  "pydantic[email]>=2.11.5",
  "pytest>=8.4.0",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.2",
  "redis>=6.2.0",
  "requests>=2.32.4",
  "resend>=2.10.0",
  "sqlmodel>=0.0.24",
  "tiktoken>=0.9.0",
  "uvicorn>=0.34.3",
  "typer>=0.16.0",
  "chromadb>=1.0.12",
  "alembic>=1.16.1",
  "alembic-postgresql-enum>=1.7.0",
  "sqlalchemy-utils>=0.41.2",
  "stripe>=12.2.0",
  "python-jose>=3.5.0",
  "logfire[sqlalchemy]>=3.18.0",
  "beautifulsoup4>=4.13.4"
]

[tool.ruff]
lint.ignore = ["E501", "E712"]

[tool.logfire]
ignore_no_config = true

[dependency-groups]
dev = ["ruff>=0.11.12"]
