# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f compose.prod.yml --profile core up -d
#
# Pin image digests for web and api in CI/CD by replacing `build:` with:
#   image: ghcr.io/<org>/ashyq-bilim-web@sha256:<digest>
#
# Resource limits below are advisory for plain Docker Compose.
# They become enforced in Docker Swarm or Kubernetes.

services:

  nginx:
    mem_limit: 256m
    cpus: "1.0"

  web:
    mem_limit: 1g
    cpus: "1.0"

  api:
    mem_limit: 2g
    cpus: "2.0"

  db:
    mem_limit: 1g
    cpus: "2.0"

  redis:
    mem_limit: 256m
    cpus: "1.0"
